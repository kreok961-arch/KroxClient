name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Grant execute permission
        run: chmod +x Krox/client/gradlew
      - name: Build with Gradle
        working-directory: Krox/client
        run: ./gradlew build --no-daemon --stacktrace
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: krox-build-${{ github.sha }}
          path: Krox/client/build/libs/*.jar
          retention-days: 14
