# Pinned from the real KROXCLIENT jar's own manifest (Fabric-Loom-Version 1.17.20,
# Fabric-Gradle-Version 9.7.1, Fabric-Loader-Version 0.19.5, MC 1.21.11) so the
# recovered source rebuilds against the exact toolchain that produced it.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.5
fabric_api_version=0.141.3+1.21.11
loom_version=1.17.20

mod_version=16.0.0
maven_group=com.krox
# ADR 0001: the spec asks for kroxclient-16.0.0.jar. Only the filename is renamed --
# mod id, package root and asset root all stay as they ship, because renaming those
# breaks every saved config/krox/ id for no functional gain.
archives_base_name=kroxclient

# Spec Part 6.3: 'A' = Phase A test build, 'B' = Phase B release. Stamped into
# fabric.mod.json so a downloaded jar is self-identifying.
kroxBuildPhase=A

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
