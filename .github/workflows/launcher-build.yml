name: Launcher Build

on:
  push:
    paths:
      - 'ZalithLauncher/**'
      - 'LWJGL/**'
      - 'Terracotta/**'
      - 'LayerController/**'
      - 'ColorPicker/**'
      - 'InputMap/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  pull_request:
    paths:
      - 'ZalithLauncher/**'
      - 'LWJGL/**'
      - 'Terracotta/**'
      - 'LayerController/**'
      - 'ColorPicker/**'
      - 'InputMap/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:

jobs:
  assembleDebug:
    name: assembleDebug (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [all, arm, arm64, x86, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # ZalithLauncher/build.gradle.kts sets ndkVersion = 25.2.9519653 and builds
      # src/main/jni/Android.mk through ndkBuild, so the NDK is a hard requirement.
      # ndk-actions/setup-ndk does not exist as a repository; every run died at
      # "Unable to resolve action" before Gradle started. See docs/audit/RISKS.md R-01.
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: 25.2.9519653

      # The keystore is gitignored (.gitignore: ZalithLauncher/*.jks), so it must
      # arrive out of band. build.gradle.kts:49 resolves file("zalith_launcher_debug.jks")
      # relative to the module dir, so that is exactly where it has to land.
      - name: Fetch signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 is not set; the debug build cannot sign."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > ZalithLauncher/zalith_launcher_debug.jks
          sha256sum ZalithLauncher/zalith_launcher_debug.jks

      - uses: gradle/actions/setup-gradle@v4

      # build.gradle.kts:26-27 hard-fails unless default_store_password /
      # default_key_password resolve. ORG_GRADLE_PROJECT_* feeds them from secrets
      # so the keystore passwords never have to live in a committed gradle.properties.
      - name: Build
        env:
          ORG_GRADLE_PROJECT_default_store_password: ${{ secrets.DEFAULT_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_default_key_password: ${{ secrets.DEFAULT_KEY_PASSWORD }}
        run: ./gradlew :ZalithLauncher:assembleDebug -Darch=${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-debug-${{ matrix.arch }}
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
