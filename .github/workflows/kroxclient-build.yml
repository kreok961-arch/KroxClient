name: Build Krox Client JAR

# The Fabric mod is a standalone Gradle project at Krox/client (its own
# settings.gradle + wrapper), not a subproject of the root Android build.
on:
  push:
    branches: [main]
    paths:
      - 'Krox/client/**'
      - '.github/workflows/kroxclient-build.yml'
  pull_request:
    paths:
      - 'Krox/client/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build client
        working-directory: Krox/client
        run: ./gradlew build --console=plain

      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: kroxclient-jar
          # archives_base_name=krox-client, mod_version=16.0.0 -> krox-client-16.0.0.jar
          path: Krox/client/build/libs/krox-client-*.jar
          if-no-files-found: error
