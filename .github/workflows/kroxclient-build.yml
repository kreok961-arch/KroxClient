name: Build Krox Client JAR
on:
  push:
    branches: [main]
    paths: ['client/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build client
        working-directory: client
        run: gradle build --console=plain
      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: kroxclient-jar
          path: client/build/libs/kroxclient-1.0.0.jar