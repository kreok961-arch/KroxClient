# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# 2-core box, 0 swap. The daemon is killed mid-:ZalithLauncher:compileDebugKotlin
# here whatever -Xmx is set to (1536m and 2560m were both tried too); RSS climbs
# to a peak and then the process is gone, with no OutOfMemoryError and no cgroup
# limit hit. The kill comes from outside the container, so these numbers are a
# floor rather than a fix. See docs/audit/RISKS.md R-06 -- CI builds the APK.
org.gradle.workers.max=1
# kotlinc in-process: an out-of-process Kotlin daemon forks a second JVM, which
# this 2-core swapless box cannot afford.
kotlin.compiler.execution.strategy=in-process
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false

# Krox Launcher branding
launcher_name=Krox Launcher
launcher_app_name=Krox Launcher
launcher_short_name=Krox

# Read by ZalithLauncher/build.gradle.kts:20,22,23 with error(...) -- the build
# refuses to configure without them. These used to live only in
# ZalithLauncher/gradle.properties, which .gitignore:46 keeps untracked, so CI
# could not see them and every push failed at configuration with
# `The "url_home" property is not set in gradle.properties`.
# The two signing passwords deliberately do NOT move here: they stay in CI
# secrets and reach Gradle as ORG_GRADLE_PROJECT_default_{store,key}_password.
url_home=https://github.com/kreok961-arch/KroxClient
launcher_version_code=200034
launcher_version_name=2.4.11
